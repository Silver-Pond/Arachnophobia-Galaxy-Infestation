name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3g -XX:+HeapDumpOnOutOfMemoryError"

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Cache Android SDK and AVD system image
      - name: Cache Android SDK and AVD
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}
            ~/.android/avd
          key: ${{ runner.os }}-android-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-

      # Step 4: Install Android SDK (only if missing)
      - name: Install Android SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip

          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            echo "Installing Android commandline tools..."
            wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
            unzip cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
            rm cmdline-tools.zip
            mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          else
            echo "✅ SDK already cached"
          fi

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH" >> $GITHUB_ENV

          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "system-images;android-30;google_apis;x86_64" \
            "emulator"

      # Step 5: Cache Gradle dependencies
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 6: Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Step 7: Run Lint
      - name: Run Lint
        run: ./gradlew lint

      # Step 8: Run Unit Tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 9: Start Emulator (with cache support + boot check)
      - name: Start and wait for Emulator
        run: |
          # Create AVD only if not cached
          if [ ! -d ~/.android/avd/test.avd ]; then
            echo "Creating new AVD..."
            echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --force
          else
            echo "✅ Reusing cached AVD"
          fi

          # Launch emulator
          $ANDROID_SDK_ROOT/emulator/emulator -avd test -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -netdelay none -netspeed full &
          adb wait-for-device

          # Wait for boot completion (max 5 min)
          boot_timeout=300
          echo "Waiting for emulator to boot..."
          SECONDS=0
          until adb shell getprop sys.boot_completed 2>/dev/null | grep -m 1 '1'; do
            if [ $SECONDS -gt $boot_timeout ]; then
              echo "❌ Emulator boot timed out!"
              exit 1
            fi
            sleep 5
          done
          echo "✅ Emulator booted successfully."
          adb shell input keyevent 82

      # Step 10: Run UI Tests
      - name: Run Instrumented UI Tests
        run: ./gradlew connectedDebugAndroidTest

      # Step 11: Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # Step 12: Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/release/app-release.apk
