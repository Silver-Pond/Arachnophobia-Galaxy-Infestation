name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        android-version: [30, 31]  # Target Android SDK versions

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up JDK 17 with Temurin
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'             # Set Java version to 17
          distribution: 'temurin'        # Use Temurin distribution (formerly AdoptOpenJDK)
          architecture: 'x64'            # Architecture (x64)
          check-latest: false            # Skip checking for the latest version

      # Step 3: Set up Android SDK (Manual Setup)
      - name: Set up Android SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O android-tools.zip
          unzip android-tools.zip -d $HOME/android-sdk
          rm android-tools.zip
          echo "export ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

          # Accept licenses and install required SDK components
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3"

      # Step 4: Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Step 5: Install dependencies
      - name: Install dependencies
        run: ./gradlew dependencies

      # Step 6: Run lint checks
      - name: Run Lint
        run: ./gradlew lint

      # Step 7: Run Unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 8: Set up Android Emulator
      - name: Set up Android Emulator
        run: |
          echo "y" | sdkmanager "system-images;android-30;google_apis;x86_64"
          sdkmanager "emulator"
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --force
          nohup emulator -avd test -no-window -noaudio -gpu swiftshader_indirect &

      # Step 9: Wait for Emulator to boot
      - name: Wait for Emulator to boot
        run: |
          # Wait until the emulator is booted up
          adb wait-for-device
          adb shell input keyevent 82 &  # Unlock the device

      # Step 10: Run UI tests on the emulator
      - name: Run UI Tests
        run: ./gradlew connectedDebugAndroidTest

      # Step 11: Build APK
      - name: Build APK
        run: ./gradlew assembleRelease

      # Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Upload APK as artifact
      - name: Upload APK as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/release/app-release.apk
