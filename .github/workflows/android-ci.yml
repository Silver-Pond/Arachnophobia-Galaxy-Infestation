name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        android-version: [30, 31]  # Target Android SDK versions
        # You can add more matrix configurations, e.g., different Java versions, etc.

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up JDK
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '11'  # Kotlin projects typically use Java 11 or newer

      # Step 3: Set up Android SDK (Manual Setup)
      - name: Set up Android SDK
        run: |
          # Install required dependencies
          sudo apt-get update -y
          sudo apt-get install -y wget unzip

          # Download and install Android SDK command-line tools
          mkdir -p $HOME/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O android-tools.zip
          unzip android-tools.zip -d $HOME/android-sdk
          rm android-tools.zip
          
          # Add the SDK to the PATH
          echo "export ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

          # Install SDK components (build tools, platforms)
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3"

      # Step 4: Install dependencies (Gradle wrapper)
      - name: Install dependencies
        run: ./gradlew dependencies

      # Step 5: Run lint checks
      - name: Run Lint
        run: ./gradlew lint

      # Step 6: Run Unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 7: Run UI tests (optional, if you have UI tests set up)
      - name: Run UI Tests (optional)
        run: ./gradlew connectedDebugAndroidTest

      # Step 8: Build APK (Release or Debug)
      - name: Build APK
        run: ./gradlew assembleRelease  # Or use assembleDebug depending on what you need

      # Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Upload APK as artifact
      - name: Upload APK as artifact
        if: success()  # Only upload if the build is successful
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/release/app-release.apk  # Adjust based on your output directory
